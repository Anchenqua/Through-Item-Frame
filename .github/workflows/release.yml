name: Release Build

on:
  workflow_dispatch:  # 手动触发
    inputs:
      version_type:
        description: '版本类型 (release/beta/alpha)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - beta
          - alpha
      release_name:
        description: 'Release标题'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整提交历史，用于生成版本信息

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: List build artifacts
      run: ls -la build/libs/

    - name: Get version from build
      id: get_version
      run: |
        # 从构建产物中提取版本号
        # 假设jar文件名格式为 modname-version.jar
        JAR_FILE=$(ls build/libs/*.jar | grep -v sources | grep -v dev | head -1)
        VERSION=$(echo $JAR_FILE | sed 's/.*-//' | sed 's/\.jar//')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: ${{ github.event.inputs.release_name || format('Release v{0}', steps.get_version.outputs.version) }}
        draft: false
        prerelease: ${{ github.event.inputs.version_type != 'release' }}
        generate_release_notes: true
        files: |
          build/libs/*.jar
          build/libs/*.jar
        body: |
          ## 构建信息
          - **版本:** v${{ steps.get_version.outputs.version }}
          - **类型:** ${{ github.event.inputs.version_type }}
          - **构建时间:** ${{ github.event.head_commit.timestamp }}
          
          ## 产物说明
          - `*.jar` - 主文件
          - `*-sources.jar` - 源代码
          - `*-dev.jar` - 开发版本
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
