name: Release build

on:
  workflow_dispatch:
    inputs:
      versions:
        description: '要构建的游戏版本，用逗号分隔（例如 26.1,1.21.8,1.20）'
        required: true
        default: '26.1,1.21.8,1.21.2,1.21,1.20,1.19,1.18'
      tag:
        description: 'Release tag（留空则自动使用 v<mod版本>）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from gradle.properties
        id: get_version
        run: |
          VERSION=$(grep -E '^mod_version=' gradle.properties | head -1 | cut -d'=' -f2 | xargs)
          if [ -z "$VERSION" ]; then
            VERSION="1.0.${{ github.run_number }}"
          fi
          CLEAN_VERSION=$(echo "$VERSION" | sed 's/^[^0-9]*//' | sed 's/[^0-9.]*$//')
          echo "清理后版本: $CLEAN_VERSION"

          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="v$CLEAN_VERSION"
          fi

          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Setup Java
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install java 25.0.2-tem || true
          sdk install java 21.0.2-tem || true

      - name: Build selected versions
        run: |
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          mkdir -p artifacts

          MOD_VERSION="${{ steps.get_version.outputs.version }}"
          IFS=',' read -ra VERSIONS <<< "${{ inputs.versions }}"

          for VERSION in "${VERSIONS[@]}"; do
            VERSION=$(echo "$VERSION" | xargs)
            if [ -z "$VERSION" ]; then
              continue
            fi

            BRANCH="${VERSION}-fabric"
            echo "=== Building ${VERSION} from ${BRANCH} ==="
            git checkout "origin/${BRANCH}"

            chmod +x ./gradlew
            if [[ "$VERSION" == 26.* ]]; then
              sdk use java 25.0.2-tem
            else
              sdk use java 21.0.2-tem
            fi

            ./gradlew build

            find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -exec cp {} artifacts/ \;
          done

          echo "=== Built files ==="
          ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "Release ${{ steps.get_version.outputs.tag }}"
          body: |
            ## Through Item Frame Mod

            **mod版本:** ${{ steps.get_version.outputs.version }}
            **构建游戏版本:** ${{ inputs.versions }}

            ### 包含文件:
            - 主模组文件
          files: artifacts/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
