name: Release build

on:
  workflow_dispatch:
    inputs:
      mod_version:
        description: 'Mod version used in branch name (e.g. 1.1.0)'
        required: true
        default: '1.1.0'
      release_tag:
        description: 'Release tag (empty = v<mod_version>)'
        required: false
        default: ''
      build_26_1:
        description: '26.1'
        type: boolean
        default: true
      build_1_21_8:
        description: '1.21.8'
        type: boolean
        default: true
      build_1_21_2:
        description: '1.21.2'
        type: boolean
        default: true
      build_1_21:
        description: '1.21'
        type: boolean
        default: true
      build_1_20:
        description: '1.20'
        type: boolean
        default: true
      build_1_19:
        description: '1.19'
        type: boolean
        default: true
      build_1_18:
        description: '1.18'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.list.outputs.versions }}
      tag: ${{ steps.list.outputs.tag }}
    steps:
      - id: list
        shell: bash
        run: |
          entries=""
          add() {
            if [ "$1" = "true" ]; then
              entries="$entries,{\"version\":\"$2\",\"java\":\"$3\"}"
            fi
          }
          add "${{ inputs.build_26_1 }}" "26.1" "25"
          add "${{ inputs.build_1_21_8 }}" "1.21.8" "21"
          add "${{ inputs.build_1_21_2 }}" "1.21.2" "21"
          add "${{ inputs.build_1_21 }}" "1.21" "21"
          add "${{ inputs.build_1_20 }}" "1.20" "21"
          add "${{ inputs.build_1_19 }}" "1.19" "21"
          add "${{ inputs.build_1_18 }}" "1.18" "21"
          echo "versions=[${entries#,}]" >> "$GITHUB_OUTPUT"
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ]; then
            tag="v${{ inputs.mod_version }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.versions != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.versions) }}
    steps:
      - name: Checkout ${{ matrix.target.version }}
        uses: actions/checkout@v4
        with:
          ref: through-item-frame-v${{ inputs.mod_version }}-${{ matrix.target.version }}-fabric

      - name: Set up JDK ${{ matrix.target.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.target.java }}
          distribution: temurin

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Collect jars
        run: |
          mkdir -p out
          find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -exec cp {} out/ \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThroughItemFrame-${{ matrix.target.version }}
          path: out/*.jar
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          draft: false
          prerelease: false
          files: artifacts/*.jar
          body: |
            ## Through Item Frame

            **Mod version:** ${{ inputs.mod_version }}

            Built from branches:
            `${{ needs.prepare.outputs.versions }}`
