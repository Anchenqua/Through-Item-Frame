name: Release build

on:
  workflow_dispatch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from gradle.properties
        id: get_version
        run: |
          if [ -f "gradle.properties" ]; then
            MINECRAFT_VERSION=$(grep -E '^minecraft_version=' gradle.properties | cut -d'=' -f2)
            echo "从gradle.properties读取版本: $VERSION"
          fi
          if [ -f "gradle.properties" ]; then
            VERSION=$(grep -E "^(mod_)?version[ \t]*=" gradle.properties | head -1 | cut -d'=' -f2 | xargs)
            echo "从gradle.properties读取版本: $VERSION"
          fi
          
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -E "version[ \t]*=" build.gradle 2>/dev/null | head -1 | cut -d"'" -f2 | cut -d'"' -f2 | xargs || true)
            echo "从build.gradle读取版本: $VERSION"
          fi
          
          if [ -z "$VERSION" ]; then
            VERSION="1.0.${{ github.run_number }}"
            echo "使用构建号作为版本: $VERSION"
          fi
          
          # 清理版本号
          CLEAN_VERSION=$(echo "$VERSION" | sed 's/^[^0-9]*//' | sed 's/[^0-9.]*$//')
          echo "清理后版本: $CLEAN_VERSION"
          
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "minecraft_version=$MINECRAFT_VERSION" >> $GITHUB_OUTPUT

      - name: Setup Java and Build
        run: |
          # 设置Java
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install java 21.0.4-tem
          sdk use java 21.0.4-tem
          
          # 构建
          chmod +x ./gradlew
          ./gradlew build

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "Release ${{ steps.get_version.outputs.tag }}"
          body: |
            ## Through Item Frame Mod
            
            **版本:** ${{ steps.get_version.outputs.version }}
            **游戏版本:** ${{ steps.get_version.outputs.minecraft_version }}
            
            ### 包含文件:
            - 主模组文件
            - 源代码文件
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
