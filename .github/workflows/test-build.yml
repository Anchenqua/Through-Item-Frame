name: Test Build

on:
  workflow_dispatch:  # 手动触发
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - dev
          - snapshot
      clean_build:
        description: '执行clean构建'
        required: true
        default: 'true'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Clean build (if selected)
      if: ${{ github.event.inputs.clean_build == 'true' }}
      run: ./gradlew clean

    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mcmod-build-${{ github.event.inputs.build_type }}-${{ github.run_id }}
        path: |
          build/libs/*.jar
          build/libs/*.json
        if-no-files-found: error
        retention-days: 60

    - name: Print build info
      run: |
        echo "=== 构建信息 ==="
        echo "构建ID: ${{ github.run_id }}"
        echo "构建类型: ${{ github.event.inputs.build_type }}"
        echo "提交: ${{ github.sha }}"
        echo ""
        echo "=== 构建产物 ==="
        ls -la build/libs/
        echo ""
        echo "=== 文件大小 ==="
        du -h build/libs/*.jar
